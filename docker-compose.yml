version: '3.8'

services:
  # ============================================
  # Nginx 前端 + 反向代理
  # ============================================
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/html:/usr/share/nginx/html
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - llsp-app
    networks:
      - llsp-net

  # ============================================
  # 主应用 (Spring Boot 2.3)
  # ============================================
  llsp-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      - SERVER_PORT=8081
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=llsp
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-your_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - CANAL_SERVER=canal:11111
      - CANAL_DESTINATION=example
    networks:
      - llsp-net

  # ============================================
  # AI 智能客服服务 (Sidecar)
  # ============================================
  ai-service:
    build:
      context: ./echo-mind-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      chromadb:
        condition: service_started
    environment:
      - AI_SERVER_PORT=8082
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=llsp
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-your_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - AI_API_KEY=${AI_API_KEY:-your_api_key_here}
      - AI_BASE_URL=${AI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode}
      - AI_MODEL=${AI_MODEL:-qwen3.5-flash}
      - AI_EMBEDDING_MODEL=${AI_EMBEDDING_MODEL:-text-embedding-v3}
      - DIANPING_BASE_URL=http://llsp-app:8081
      - CHROMADB_URL=http://chromadb:8000
    networks:
      - llsp-net

  # ============================================
  # MySQL
  # ============================================
  mysql:
    image: mysql:5.7
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-your_password}
      - MYSQL_DATABASE=llsp
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/db/llsp.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llsp-net

  # ============================================
  # Redis
  # ============================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - llsp-net

  # ============================================
  # RabbitMQ
  # ============================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - llsp-net

  # ============================================
  # Elasticsearch
  # ============================================
  elasticsearch:
    image: elasticsearch:7.12.1
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - llsp-net

  # ============================================
  # ChromaDB (AI 向量数据库)
  # ============================================
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - llsp-net

networks:
  llsp-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  es_data:
  chroma_data:
