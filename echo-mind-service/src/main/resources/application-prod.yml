server:
  port: ${AI_SERVER_PORT:8082}

spring:
  application:
    name: ai-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:llsp}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 1
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 10
          max-wait: 5000ms
  ai:
    openai:
      api-key: "${AI_API_KEY:your_api_key_here}"
      base-url: "${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}"
      chat:
        options:
          model: "${AI_MODEL:qwen3.5-flash}"
          temperature: 0.2

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.ai.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

ai:
  dianping-base-url: ${DIANPING_BASE_URL:http://llsp-app:8081}
  intent:
    weights:
      llm: 0.5
      embedding: 0.3
      pattern: 0.2
    confidence-threshold:
      high: 0.8
      medium: 0.6
  memory:
    short-term-max: 10
    compress-threshold: 5
  agent:
    max-retry: 2
    timeout-ms: 30000
  monitor:
    metrics-window-minutes: 60
    weight-adjust-interval-minutes: 10
  vector:
    default-collection: knowledge_base
    default-top-k: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.ai: INFO
    org.springframework.ai: WARN
